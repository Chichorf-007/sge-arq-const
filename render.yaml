services:
  - type: web
    name: sge-arq-const
    env: node
    buildCommand: npm run build
    startCommand: npm start
    # NOTA: este servicio está creado como Web Service en Render, no como Blueprint,
    # por lo que Render NO lee este archivo automáticamente para configurar variables.
    # Las variables de entorno reales deben cargarse a mano en el dashboard de Render
    # (Environment). Los valores `sync: false` de abajo son documentación para el caso
    # de que en el futuro se migre este servicio a un Blueprint gestionado por render.yaml.
    envVars:
      - key: SUPABASE_URL
        value: https://yjoksbfrnsagjtlcvvbm.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

